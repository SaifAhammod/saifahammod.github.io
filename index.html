<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saif Ahammod</title>
  <link rel="icon" type="image/x-icon" href="assets/img/logo.png">

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
    }

    .blur,
    .main,
    .particles {
      width: 100%;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .blur {
      background-image: url("/assets/img/Homebackground.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      filter: blur(5px);
      transform: scale(1.2);
    }

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      z-index: 100;
      text-align: center;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
    }


    .particles {
      position: absolute;
      overflow: hidden;
    }

    .particle {
      border-radius: 50%;
      filter: blur(3px);
      position: absolute;
    }

    @keyframes bg {
      0% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1.3);
      }
    }

    @keyframes move {
      0% {
        transform: translateX(0);
        opacity: 0;
      }

      10%,
      90% {
        opacity: 1;
      }

      100% {
        transform: translateX(45vw);
        opacity: 0;
      }
    }

    img {
      display: block;
      margin: 10px auto 50px;
      /* padding: 3px; */
      max-width: 100%;
      height: auto;
    }

    h1 {
      font-size: 20px;
      font-family: 'Orbitron', sans-serif;
      color: var(--lightColor);
      letter-spacing: .4em;
      word-wrap: break-word;
      padding: 0 10px;
    }

    .button {
      border: none;
      color: #fff7c5;
      text-align: center;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      transition-duration: 0.4s;
      cursor: pointer;
      border-radius: 2px;
      border-top-left-radius: 25px;
      border-bottom-right-radius: 25px;
      font-family: Arial, sans-serif;
      margin-top: 20px;
    }

    .button1 {
      background-color: Transparent;
      height: 50px;
      width: 170px;
      overflow: auto;
      padding: 10px;
      font-family: 'Orbitron', sans-serif;
      color: var(--lightColor);
      border: 3px solid var(--lightColor);
      letter-spacing: .2em;
    }

    .button1:hover {
      color: var(--darkColor);
      background-color: var(--lightColor);
      border: 3px solid var(--darkColor);
      font-size: large;
    }

    Container
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      padding: 5px;
      gap: 20px;
      max-width: 1400px;
      width: 100%;
    }

    .container div {
      border: none;
      color: #fff7c5;
      text-align: center;
      font-size: 16px;
      font-family: Arial, sans-serif;
      margin-top: 20px;
      padding: 10px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Tablet Styles */

        @media (max-width: 10000px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      h1 {
        font-size: 18px;
        letter-spacing: .3em;
      }

      img {
        margin: 20px auto 40px;
        max-width: 20%;
      }
    }
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      h1 {
        font-size: 18px;
        letter-spacing: .3em;
      }

      img {
        margin: 20px auto 40px;
        max-width: 20%;
      }
    }

    /* Mobile Landscape & Small Tablet */
    @media (max-width: 768px) {
      .main {
        padding: 15px;
      }

      .container {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      h1 {
        font-size: 16px;
        letter-spacing: .2em;
      }

      .button1 {
        height: 60px;
        width: 180px;
        font-size: 15px;
        padding: 15px;
      }

      .button1:hover {
        height: 60px;
        width: 180px;
        font-size: 15px;
      }

      img {
        margin: 10px auto 30px;
        padding: 10px;
      }

      .container div {
        min-height: 250px;
      }
    }

    /* Mobile Portrait */
    @media (max-width: 480px) {
      .main {
        padding: 10px;
        align-items: flex-start;
        /* padding-top: 30px; */
      }

      .container {
        gap: 12px;
      }

      h1 {
        font-size: 10px;
        letter-spacing: .15em;
      }

      .button1 {
        height: 50px;
        width: 150px;
        font-size: 13px;
        letter-spacing: .15em;
      }

      .button1:hover {
        height: 50px;
        width: 150px;
        font-size: 13px;
      }

      img {
        margin: 10px auto 20px;
        padding: 5px;
        max-width: 50%;
      }

      .container div {
        min-height: 220px;
        padding: 8px;
        margin-top: 10px;
      }
    }

    /* Extra Small Devices */
    @media (max-width: 360px) {
      h1 {
        font-size: 12px;
        letter-spacing: .1em;
      }

      .button1 {
        height: 45px;
        width: 130px;
        font-size: 12px;
        padding: 10px;
      }

      .button1:hover {
        height: 45px;
        width: 130px;
        font-size: 12px;
      }

      img {
        margin: 40px auto 80px;
        max-width: 60%;
      }

      .container div {
        min-height: 200px;
      }
    }
  </style>
</head>

<body>
  <div class="blur"></div>
  <div class="main" id="main">
    <div align="center">
      <div class="container">
        <div>
          <div>
            <img src="assets/img/logo/WhiteLogo.png" alt="SAIF" style="width:100%;">
            <h1>ASSALAMU ALAIKUM</h1>
          </div>
          <a href="/about/"><button class="button button1">ReadMe</button></a>
        </div>

       
      </div>
    </div>
  </div>

  <div class="particles" id="particles"></div>

  <!-- Link your JavaScript -->
  <script src="main.js"></script>

</body>

</html>
